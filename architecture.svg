<svg viewBox="0 0 820 1500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="1500" fill="#ffffff"/>
  <text x="410" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">AI Job Hunter — Pipeline Architecture</text>

  <!-- Node style helper values -->
  <!-- 1. Gemini Agent -->
  <g>
    <rect x="260" y="70" width="300" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="410" y="105" text-anchor="middle" font-size="16" fill="#312e81" font-weight="600">Gemini Agent (LangGraph)</text>
  </g>
  <line x1="410" y1="130" x2="410" y2="160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. MCP -->
  <g>
    <rect x="260" y="160" width="300" height="60" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="410" y="195" text-anchor="middle" font-size="16" fill="#164e63" font-weight="600">MCP Server (tools)</text>
  </g>
  <line x1="410" y1="220" x2="410" y2="250" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Multi-Source Search -->
  <g>
    <rect x="230" y="250" width="360" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="410" y="277" text-anchor="middle" font-size="16" fill="#14532d" font-weight="600">Multi-Source Search</text>
    <text x="410" y="297" text-anchor="middle" font-size="12" fill="#166534">Adzuna · IndianAPI (retry + graceful skip)</text>
  </g>
  <line x1="410" y1="310" x2="410" y2="340" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Normalize -->
  <g>
    <rect x="260" y="340" width="300" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="410" y="375" text-anchor="middle" font-size="16" fill="#78350f" font-weight="600">Normalize</text>
  </g>
  <line x1="410" y1="400" x2="410" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Dedup -->
  <g>
    <rect x="260" y="430" width="300" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="410" y="465" text-anchor="middle" font-size="16" fill="#78350f" font-weight="600">Deduplication</text>
  </g>
  <line x1="410" y1="490" x2="410" y2="520" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. Hard Filter -->
  <g>
    <rect x="260" y="520" width="300" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="410" y="555" text-anchor="middle" font-size="16" fill="#7f1d1d" font-weight="600">Hard Filtering</text>
  </g>
  <line x1="410" y1="580" x2="410" y2="610" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. Matching (two boxes side by side) -->
  <g>
    <rect x="150" y="610" width="230" height="70" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="265" y="640" text-anchor="middle" font-size="15" fill="#581c87" font-weight="600">Keyword Matching</text>
    <text x="265" y="660" text-anchor="middle" font-size="12" fill="#6b21a8">skill overlap score</text>
  </g>
  <g>
    <rect x="440" y="610" width="230" height="70" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="555" y="640" text-anchor="middle" font-size="15" fill="#581c87" font-weight="600">Semantic Matching</text>
    <text x="555" y="660" text-anchor="middle" font-size="12" fill="#6b21a8">MiniLM + ChromaDB</text>
  </g>
  <line x1="265" y1="680" x2="265" y2="700" stroke="#4b5563" stroke-width="2"/>
  <line x1="555" y1="680" x2="555" y2="700" stroke="#4b5563" stroke-width="2"/>
  <line x1="265" y1="700" x2="555" y2="700" stroke="#4b5563" stroke-width="2"/>
  <line x1="410" y1="700" x2="410" y2="730" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. Ranking -->
  <g>
    <rect x="260" y="730" width="300" height="60" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="410" y="758" text-anchor="middle" font-size="16" fill="#581c87" font-weight="600">Ranking</text>
    <text x="410" y="777" text-anchor="middle" font-size="12" fill="#6b21a8">weighted: semantic + keyword + experience + freshness</text>
  </g>
  <line x1="410" y1="790" x2="410" y2="820" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 9. PostgreSQL -->
  <g>
    <rect x="260" y="820" width="300" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="410" y="847" text-anchor="middle" font-size="16" fill="#1e3a8a" font-weight="600">PostgreSQL (Neon)</text>
    <text x="410" y="866" text-anchor="middle" font-size="12" fill="#1e40af">upsert · search history</text>
  </g>
  <line x1="410" y1="880" x2="410" y2="910" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 10. Active Verification -->
  <g>
    <rect x="260" y="910" width="300" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="410" y="945" text-anchor="middle" font-size="16" fill="#14532d" font-weight="600">Active Verification</text>
  </g>
  <line x1="410" y1="970" x2="410" y2="1000" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 11. Streamlit UI -->
  <g>
    <rect x="230" y="1000" width="360" height="60" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="410" y="1035" text-anchor="middle" font-size="16" fill="#831843" font-weight="600">Streamlit UI</text>
  </g>

  <!-- Legend / eval note -->
  <rect x="150" y="1100" width="520" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="410" y="1130" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">Offline Evaluation (eval/evaluate_ranking.py)</text>
  <text x="410" y="1150" text-anchor="middle" font-size="12" fill="#4b5563">Re-runs Normalize → Dedup → Filter → Matching → Ranking</text>
  <text x="410" y="1168" text-anchor="middle" font-size="12" fill="#4b5563">against frozen, labelled fixtures — measures Precision@5</text>
</svg>
